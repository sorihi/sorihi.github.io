<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Assigner</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        .group-card {
            transition: transform 300ms ease, box-shadow 300ms ease, background-color 300ms ease;
            will-change: transform;
            transform: translateY(0);
        }

        .group-card.is-randomizing {
            transform: translateY(10px);
        }

        .assigned-notice {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-left: 0.35rem;
            opacity: 1;
            transition: opacity 300ms ease, transform 300ms ease;
            animation: noticePulse 300ms ease;
        }

        .assigned-notice.is-fading {
            opacity: 0;
            transform: translateY(-2px) scale(0.85);
        }

        @keyframes noticePulse {
            0% {
                transform: scale(0.85);
            }
            50% {
                transform: scale(1.18);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4 mt-5">
        <div class="text-center">
            <h1 class="mb-4"><strong>🚀 Group Assigner</strong></h1>
            <p class="text-muted"><small>Masukkan nama untuk dimasukkan dalam kelompok</small></p>
        </div>

        <div id="controls" class="mb-5">
            <form id="nameForm" class="row g-2 align-items-center justify-content-center">
                <div class="col-auto">
                    <input id="studentName" class="form-control border-0 shadow-sm bg-white" type="text" placeholder="Nama mahasiswa" autocomplete="off">
                </div>
                <div class="col-auto">
                    <button id="submitBtn" class="btn btn-primary" type="submit">Assign</button>
                </div>
                <div class="col-auto align-self-center ms-2">
                    <small>
                        <span id="remaining" class="text-muted"></span>
                    </small>
                </div>
            </form>
        </div>

        <div id="groupsRow" class="row gy-3 justify-content-center"></div>

        <div id="doneAlert" class="text-center mt-3 d-none"><small class="text-muted">✅ Semua kelompok sudah terisi</small></div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        // State
        let totalStudents = 0;
        let maxPerGroup = 0;
        let groups = [];
        let groupTargets = [];
        let assignedCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            initPrompts();
            document.getElementById('nameForm').addEventListener('submit', onSubmitName);
        });

        function initPrompts() {
            totalStudents = readOrAskInteger(totalStudents, 'Jumlah mahasiswa?');
            maxPerGroup = readOrAskInteger(maxPerGroup, 'Jumlah anggota per kelompok?');
            if (totalStudents <= 0 || maxPerGroup <= 0) {
                alert('Angka yang dimasukkan tidak valid. Muat ulang untuk mencoba lagi.');
                return;
            }
            const groupCount = Math.ceil(totalStudents / maxPerGroup);
            // initialize groups array
            groups = Array.from({length: groupCount}, () => []);
            groupTargets = buildGroupTargets(totalStudents, maxPerGroup, groupCount);
            renderGroups(groupCount);
            updateRemaining();
        }

        function buildGroupTargets(total, maxSize, groupCount) {
            const targets = Array.from({length: groupCount}, () => Math.floor(total / groupCount));
            let extraStudents = total % groupCount;

            for (let i = 0; i < targets.length && extraStudents > 0; i++) {
                targets[i]++;
                extraStudents--;
            }

            for (let i = 0; i < targets.length; i++) {
                if (targets[i] > maxSize) {
                    targets[i] = maxSize;
                }
            }

            for (let i = targets.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targets[i], targets[j]] = [targets[j], targets[i]];
            }

            return targets;
        }

        function readOrAskInteger(currentValue, message) {
            if (currentValue > 0) return currentValue;

            let val;
            do {
                const r = prompt(message);
                if (r === null) return 0;
                val = parseInt(r, 10);
            } while (Number.isNaN(val) || val <= 0);
            return val;
        }

        function renderGroups(n) {
            const row = document.getElementById('groupsRow');
            row.innerHTML = '';
            for (let i = 0; i < n; i++) {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
                col.innerHTML = `
                    <div class="card group-card border-0 shadow-sm h-100" data-group-index="${i}">
                        <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                            <div>
                                <strong>🚀 Kelompok ${i+1}</strong>
                            </div>
                            <div class="assign-placeholder"></div>
                        </div>
                        <div class="members card-body pt-0" style="min-height:60px;"></div>
                    </div>
                `;
                row.appendChild(col);
            }
        }

        function updateRemaining() {
            const rem = totalStudents - assignedCount;
            document.getElementById('remaining').textContent = `Remaining: ${rem}`;
            if (rem <= 0) {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('studentName').disabled = true;
                document.getElementById('doneAlert').classList.remove('d-none');
            }
        }

        function onSubmitName(e) {
            e.preventDefault();
            const input = document.getElementById('studentName');
            const name = input.value.trim();
            if (!name) return;
            if (assignedCount >= totalStudents) return;
            disableForm(true);
            animateAssign(name).then(groupIndex => {
                appendToGroup(groupIndex, name);
                assignedCount++;
                updateRemaining();
                input.value = '';
                input.focus();
                disableForm(false);
            }).catch(err => {
                console.error(err);
                disableForm(false);
            });
        }

        function disableForm(disabled) {
            document.getElementById('submitBtn').disabled = disabled;
            document.getElementById('studentName').disabled = disabled;
        }

        function pickWeightedGroupIndex() {
            const weighted = [];

            for (let i = 0; i < groups.length; i++) {
                const remainingSeats = groupTargets[i] - groups[i].length;
                for (let j = 0; j < remainingSeats; j++) {
                    weighted.push(i);
                }
            }

            if (weighted.length === 0) return -1;
            return weighted[Math.floor(Math.random() * weighted.length)];
        }

        function animateAssign(name) {
            return new Promise((resolve, reject) => {
                const cards = Array.from(document.querySelectorAll('#groupsRow .card'));
                const finalIdx = pickWeightedGroupIndex();
                if (finalIdx < 0) return reject('No available groups');
                let phase = 0;
                const pulseCount = 3;

                const pulse = () => {
                    const active = phase % 2 === 0;
                    cards.forEach((card, index) => {
                        card.style.transitionDelay = `${(index % 4) * 40}ms`;
                        card.classList.toggle('is-randomizing', active);
                    });

                    phase++;
                    if (phase < pulseCount * 2) {
                        setTimeout(pulse, 300);
                    } else {
                        cards.forEach(card => {
                            card.classList.remove('is-randomizing');
                            card.style.transitionDelay = '';
                        });
                        resolve(finalIdx);
                    }
                };

                pulse();
            });
        }

        function appendToGroup(index, name) {
            groups[index].push(name);
            const card = document.querySelectorAll('#groupsRow .card')[index];
            const ul = card.querySelector('.members');
            const li = document.createElement('div');
            li.className = 'd-flex align-items-center';

            // make name lowercase and capitalize first letter of each word
            const formattedName = name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

            const nameSpan = document.createElement('span');
            nameSpan.textContent = '🧑‍🚀 ' + formattedName;

            const notice = document.createElement('span');
            notice.className = 'assigned-notice';
            notice.setAttribute('aria-hidden', 'true');
            notice.textContent = '✅';

            li.appendChild(nameSpan);
            li.appendChild(notice);
            ul.appendChild(li);

            setTimeout(() => {
                requestAnimationFrame(() => {
                    notice.classList.add('is-fading');
                });
            }, 1000);

            setTimeout(() => {
                notice.remove();
            }, 1450);

            // update count if displayed
            const countEl = card.querySelector('.count');
            if (countEl) countEl.textContent = groups[index].length;
        }
    </script>
</body>
</html>
