<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Assigner</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-3">Group Assigner</h1>
        <p class="text-muted">Masukkan nama Anda untuk dimasukkan dalam kelompok</p>

        <div id="controls" class="mb-3">
            <form id="nameForm" class="row g-2 align-items-center">
                <div class="col-auto">
                    <input id="studentName" class="form-control" type="text" placeholder="Student name" autocomplete="off">
                </div>
                <div class="col-auto">
                    <button id="submitBtn" class="btn btn-primary" type="submit">Submit</button>
                </div>
                <div class="col-auto align-self-center">
                    <span id="remaining" class="text-muted"></span>
                </div>
            </form>
        </div>

        <div id="groupsRow" class="row gy-3"></div>

        <div id="doneAlert" class="alert alert-success mt-3 d-none">Semua kelompok sudah terisi.</div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        // State
        let totalStudents = 0;
        let maxPerGroup = 0;
        let groups = [];
        let assignedCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            initPrompts();
            document.getElementById('nameForm').addEventListener('submit', onSubmitName);
        });

        function initPrompts() {
            totalStudents = askInteger('Jumlah mahasiswa?');
            maxPerGroup = askInteger('Jumlah anggota per kelompok?');
            if (totalStudents <= 0 || maxPerGroup <= 0) {
                alert('Angka yang dimasukkan tidak valid. Muat ulang untuk mencoba lagi.');
                return;
            }
            const groupCount = Math.ceil(totalStudents / maxPerGroup);
            // initialize groups array
            groups = Array.from({length: groupCount}, () => []);
            renderGroups(groupCount);
            updateRemaining();
        }

        function askInteger(message) {
            let val;
            do {
                const r = prompt(message);
                if (r === null) return 0;
                val = parseInt(r, 10);
            } while (Number.isNaN(val) || val <= 0);
            return val;
        }

        function renderGroups(n) {
            const row = document.getElementById('groupsRow');
            row.innerHTML = '';
            for (let i = 0; i < n; i++) {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
                col.innerHTML = `
                    <div class="card h-100" data-group-index="${i}">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div>
                                <strong>Kelompok ${i+1}</strong>
                            </div>
                            <div class="assign-placeholder"></div>
                        </div>
                        <ul class="list-group list-group-flush members" style="min-height:60px;"></ul>
                    </div>
                `;
                row.appendChild(col);
            }
        }

        function updateRemaining() {
            const rem = totalStudents - assignedCount;
            document.getElementById('remaining').textContent = `Remaining: ${rem}`;
            if (rem <= 0) {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('studentName').disabled = true;
                document.getElementById('doneAlert').classList.remove('d-none');
            }
        }

        function onSubmitName(e) {
            e.preventDefault();
            const input = document.getElementById('studentName');
            const name = input.value.trim();
            if (!name) return;
            if (assignedCount >= totalStudents) return;
            disableForm(true);
            const forced = findForcedGroupIndex();
            animateAssign(name, forced).then(groupIndex => {
                appendToGroup(groupIndex, name);
                assignedCount++;
                updateRemaining();
                input.value = '';
                input.focus();
                disableForm(false);
            }).catch(err => {
                console.error(err);
                disableForm(false);
            });
        }

        function disableForm(disabled) {
            document.getElementById('submitBtn').disabled = disabled;
            document.getElementById('studentName').disabled = disabled;
        }

        function availableGroupIndexes() {
            const idxs = [];
            const cards = document.querySelectorAll('#groupsRow .card');
            cards.forEach((card, i) => {
                const count = groups[i].length;
                if (count < maxPerGroup) idxs.push(i);
            });
            return idxs;
        }

        // If one group has exactly the same number of free slots as
        // remaining unassigned students, that group must take all remaining.
        function findForcedGroupIndex() {
            const remaining = totalStudents - assignedCount; // includes current submit
            for (let i = 0; i < groups.length; i++) {
                const slotsLeft = maxPerGroup - groups[i].length;
                if (slotsLeft === remaining) return i;
            }
            return -1;
        }

        function animateAssign(name, forcedIndex) {
            return new Promise((resolve, reject) => {
                const cards = Array.from(document.querySelectorAll('#groupsRow .card'));
                const totalSteps = (typeof forcedIndex === 'number' && forcedIndex >= 0)
                    ? 6 + Math.floor(Math.random() * 6) // shorter animation when forced
                    : 20 + Math.floor(Math.random() * 16); // 20-35 steps
                let step = 0;
                let lastIndex = -1;
                const interval = 80;

                const available = availableGroupIndexes();
                if (available.length === 0) return reject('No available groups');

                const placeholderSpans = cards.map(card => card.querySelector('.assign-placeholder'));

                const timer = setInterval(() => {
                    // remove highlight from previous
                    if (lastIndex >= 0) {
                        cards[lastIndex].classList.remove('border', 'border-3', 'border-primary');
                        const ph = placeholderSpans[lastIndex];
                        if (ph) ph.textContent = '';
                    }

                    // choose random index only from non-full groups
                    const currentAvail = availableGroupIndexes();
                    if (currentAvail.length === 0) {
                        clearInterval(timer);
                        return reject('No available groups during animation');
                    }
                    const idx = currentAvail[Math.floor(Math.random() * currentAvail.length)];
                    lastIndex = idx;

                    // show name in placeholder and highlight
                    cards[idx].classList.add('border', 'border-3', 'border-primary');
                    const ph = placeholderSpans[idx];
                    if (ph) ph.textContent = name;

                    step++;
                    if (step >= totalSteps) {
                        clearInterval(timer);
                        // pick final group from available (non-full) or use forced index
                        const avail = availableGroupIndexes();
                        if (avail.length === 0) return reject('No available group at final step');
                        const finalIdx = (typeof forcedIndex === 'number' && forcedIndex >= 0)
                            ? forcedIndex
                            : avail[Math.floor(Math.random() * avail.length)];

                        // clear last highlight
                        if (lastIndex >= 0) {
                            cards[lastIndex].classList.remove('border', 'border-3');
                            const ph2 = placeholderSpans[lastIndex];
                            if (ph2) ph2.textContent = '';
                        }

                        // briefly highlight final target and show name
                        cards[finalIdx].classList.add('border', 'border-3', 'border-success');
                        const phFinal = placeholderSpans[finalIdx];
                        if (phFinal) phFinal.textContent = name;

                        setTimeout(() => {
                            if (phFinal) phFinal.textContent = '';
                            cards[finalIdx].classList.remove('border', 'border-3', 'border-success');
                            resolve(finalIdx);
                        }, 600);
                    }
                }, interval);
            });
        }

        function appendToGroup(index, name) {
            groups[index].push(name);
            const card = document.querySelectorAll('#groupsRow .card')[index];
            const ul = card.querySelector('.members');
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = name;
            ul.appendChild(li);
            // update count if displayed
            const countEl = card.querySelector('.count');
            if (countEl) countEl.textContent = groups[index].length;
        }
    </script>
</body>
</html>
